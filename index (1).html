<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardMargin — TCG Buy Calculator</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#f5f7fb} .wrap{max-width:1050px;margin:auto;padding:28px 20px 60px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.logo{font-weight:800;font-size:22px}.logo span{color:#8b7cff}.pill{font-size:13px;color:#aeb8cc}.hero{max-width:760px;margin-bottom:30px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.98;margin:0 0 18px;letter-spacing:-3px}.hero h1 span{color:#8b7cff}.hero p{font-size:19px;line-height:1.5;color:#aeb8cc}.card{background:#121a2e;border:1px solid #25304b;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0004}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-size:13px;color:#9ca9c1;margin-bottom:7px}.field input,.field select{width:100%;padding:14px;border-radius:12px;border:1px solid #303c5a;background:#0c1324;color:white;font-size:16px;outline:none}.field input:focus,.field select:focus{border-color:#8b7cff}.full{grid-column:1/-1}.button{margin-top:18px;width:100%;padding:15px;border:0;border-radius:13px;background:#8b7cff;color:white;font-size:17px;font-weight:750;cursor:pointer}.button:hover{filter:brightness(1.08)}.result{margin-top:18px;display:none}.result.show{display:block}.verdict{font-size:26px;font-weight:800;margin-bottom:5px}.sub{color:#9ca9c1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{background:#0c1324;border-radius:14px;padding:16px}.stat b{display:block;font-size:23px;margin-top:5px}.green{color:#54e39b}.yellow{color:#ffd166}.red{color:#ff6b7a}.note{margin-top:18px;color:#8995ab;font-size:12px;line-height:1.5}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{letter-spacing:-2px}}
</style></head><body><main class="wrap"><nav class="nav"><div class="logo">Card<span>Margin</span></div><div class="pill">TCG buy calculator · MVP</div></nav><section class="hero"><h1>Is this card<br><span>a good buy?</span></h1><p>Calculate your potential profit, ROI and buying margin before you spend your money.</p></section><section class="card"><div class="grid"><div class="field full"><label>Card / Product</label><input id="name" placeholder="e.g. Mega Gengar ex SIR"></div><div class="field"><label>Buy price</label><input id="buy" type="number" min="0" step="0.01" placeholder="550"></div><div class="field"><label>Market price</label><input id="market" type="number" min="0" step="0.01" placeholder="800"></div><div class="field"><label>Marketplace</label><select id="platform"><option value="0.05">Cardmarket · 5%</option><option value="0.10">eBay · 10%</option><option value="0.00">Private sale · 0%</option></select></div><div class="field"><label>Condition</label><select id="condition"><option>Near Mint</option><option>Excellent</option><option>Played</option></select></div></div><button class="button" onclick="calculate()">Check the deal</button><div id="result" class="result"><div id="verdict" class="verdict"></div><div id="detail" class="sub"></div><div class="stats"><div class="stat">Profit<b id="profit"></b></div><div class="stat">ROI<b id="roi"></b></div><div class="stat">Buy margin<b id="margin"></b></div></div><div class="note">MVP estimate. Fees are simplified and do not include shipping, taxes or currency conversion.</div></div></section></main><script>
const money=n=>n.toFixed(2);function calculate(){const buy=+document.getElementById('buy').value,market=+document.getElementById('market').value,fee=+document.getElementById('platform').value,name=document.getElementById('name').value||'This item';if(!(buy>0&&market>=0)){alert('Enter a buy price and market price.');return}const net=market*(1-fee),profit=net-buy,roi=profit/buy*100,margin=(1-buy/market)*100;let cls=profit>0?'green':profit===0?'yellow':'red',label=roi>=25?'STRONG BUY':roi>=10?'GOOD BUY':roi>=0?'THIN MARGIN':'PASS';document.getElementById('verdict').className='verdict '+cls;document.getElementById('verdict').textContent=label;document.getElementById('detail').textContent=`${name} · estimated net sale ${money(net)}`;document.getElementById('profit').className=cls;document.getElementById('profit').textContent=money(profit);document.getElementById('roi').className=cls;document.getElementById('roi').textContent=money(roi)+'%';document.getElementById('margin').className=cls;document.getElementById('margin').textContent=money(margin)+'%';document.getElementById('result').classList.add('show')}
</script></body></html>
